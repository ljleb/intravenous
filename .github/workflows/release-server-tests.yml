name: Release server and tests

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-server-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Configure Release build
        run: |
          nix develop --command bash -euo pipefail -c '
            cmake -S . -B build -G Ninja \
              -DCMAKE_BUILD_TYPE=Release \
              -DJUCE_DIR="$JUCE_DIR"
          '

      - name: Build Release server and tests
        run: |
          nix develop --command bash -euo pipefail -c '
            cmake --build build --parallel
          '

      - name: Run all tests
        run: |
          nix develop --command bash -euo pipefail -c '
            ctest --test-dir build --output-on-failure --no-tests=error
          '

      - name: Stress task-runner pass-count regression
        run: |
          nix develop --command bash -euo pipefail -c '
            ctest --test-dir build \
              --output-on-failure \
              --no-tests=error \
              --repeat until-fail:50 \
              -R "^TasksRunnerTest\\.RunsEveryTaskOncePerPass$"
          '
